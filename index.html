<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Gallery - Slate Navy</title>
    <!-- Tailwind CSS untuk styling cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Desain Slate Navy Glassmorphism */
        body {
            background-color: #0f172a; /* Slate 900 */
            color: #e2e8f0; /* Slate 200 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, transparent 70%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }
        .img-card:hover img {
            transform: scale(1.05);
        }
        img {
            transition: transform 0.3s ease;
        }
        /* Scrollbar kustom */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="pb-10">

    <!-- Navbar -->
    <nav class="glass sticky top-0 z-40 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="text-2xl font-bold text-white flex items-center gap-2 tracking-wide">
            <i class="fa-solid fa-camera-retro text-blue-400"></i> GaleriKu
        </div>
        <div class="flex items-center gap-4 w-full md:w-auto">
            <div class="relative w-full md:w-64">
                <i class="fa-solid fa-search absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Cari gambar..." class="w-full bg-slate-800/50 border border-slate-600 rounded-full py-2 pl-10 pr-4 text-sm focus:outline-none focus:border-blue-400 transition">
            </div>
            <button onclick="document.getElementById('uploadModal').classList.remove('hidden')" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-full font-medium transition flex items-center gap-2 whitespace-nowrap shadow-lg shadow-blue-900/50">
                <i class="fa-solid fa-cloud-arrow-up"></i> <span class="hidden sm:inline">Upload</span>
            </button>
        </div>
    </nav>

    <!-- Galeri Grid -->
    <main class="container mx-auto px-6 mt-8">
        <div id="galleryContainer" class="columns-1 sm:columns-2 md:columns-3 lg:columns-4 gap-6 space-y-6">
            <!-- Gambar akan dimuat di sini oleh JavaScript -->
            <div class="text-slate-400 text-center col-span-full py-10" id="loadingText">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
                <p>Memuat galeri dari Firebase...</p>
            </div>
        </div>
    </main>

    <!-- Modal Upload -->
    <div id="uploadModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4">
        <div class="glass w-full max-w-md rounded-2xl p-6 relative">
            <button onclick="document.getElementById('uploadModal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h2 class="text-xl font-bold mb-4 text-white">Upload Gambar Baru</h2>
            <form id="uploadForm" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 text-slate-300">Pilih Gambar</label>
                    <input type="file" id="fileInput" accept="image/*" required class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
                </div>
                <div>
                    <label class="block text-sm mb-1 text-slate-300">Deskripsi / Judul</label>
                    <input type="text" id="descInput" required placeholder="Pemandangan gunung..." class="w-full bg-slate-800 border border-slate-600 rounded-lg py-2 px-3 focus:outline-none focus:border-blue-400">
                </div>
                <div>
                    <label class="block text-sm mb-1 text-slate-300">Nama Pengunggah (Opsional)</label>
                    <input type="text" id="uploaderInput" placeholder="Anonim" class="w-full bg-slate-800 border border-slate-600 rounded-lg py-2 px-3 focus:outline-none focus:border-blue-400">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded-lg font-bold transition text-white mt-2">
                    Upload ke Galeri
                </button>
            </form>
        </div>
    </div>

    <!-- Firebase dan Logika Aplikasi -->
    <script type="module">
        // Import Firebase SDK (menggunakan versi stabil 10.8.0)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, updateDoc, doc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // KODE FIREBASE MILIKMU (Sudah dipasang otomatis)
        const firebaseConfig = {
            apiKey: "AIzaSyA2wEODiMh27wAhNb-LMtciNCxYnEh6d5k",
            authDomain: "web-gallery-a2420.firebaseapp.com",
            projectId: "web-gallery-a2420",
            storageBucket: "web-gallery-a2420.firebasestorage.app",
            messagingSenderId: "497097670731",
            appId: "1:497097670731:web:6653269e5c9ec59831cdce",
            measurementId: "G-5TB64V2THF"
        };

        // Inisialisasi Firebase & Database
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const imagesCollection = collection(db, "images");

        let allImages = []; // Menyimpan data lokal untuk fitur pencarian

        // Mengambil data secara real-time dari Firestore
        const q = query(imagesCollection, orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            document.getElementById("loadingText").style.display = "none";
            const gallery = document.getElementById("galleryContainer");
            gallery.innerHTML = ""; // Bersihkan galeri
            allImages = [];

            if (snapshot.empty) {
                gallery.innerHTML = `<div class="text-slate-500 text-center col-span-full py-10">Belum ada gambar yang diunggah. Jadilah yang pertama!</div>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                allImages.push({ id: docSnap.id, ...data });
                renderCard(docSnap.id, data);
            });
        }, (error) => {
            console.error("Error Firebase:", error);
            document.getElementById("loadingText").innerHTML = `<span class="text-red-400"><i class="fa-solid fa-triangle-exclamation"></i> Error terhubung ke database. Pastikan Firestore 'Test Mode' sudah aktif.</span>`;
        });

        // Fungsi menampilkan kartu gambar
        function renderCard(id, data) {
            const gallery = document.getElementById("galleryContainer");
            const card = document.createElement("div");
            card.className = "glass img-card rounded-xl overflow-hidden relative group break-inside-avoid mb-6";
            
            card.innerHTML = `
                <img src="${data.url}" class="w-full h-auto object-cover" alt="Gallery Image" loading="lazy">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4">
                    <p class="text-white font-semibold text-sm truncate">${data.desc}</p>
                    <div class="flex justify-between items-center mt-2">
                        <span class="text-xs text-slate-300"><i class="fa-solid fa-user text-blue-400"></i> ${data.uploader || 'Anonim'}</span>
                        <button class="like-btn text-white hover:text-pink-400 transition flex items-center gap-1 text-sm bg-slate-900/50 px-2 py-1 rounded-lg backdrop-blur-md" data-id="${id}">
                            <i class="fa-solid fa-heart"></i> ${data.likes || 0}
                        </button>
                    </div>
                </div>
            `;
            gallery.appendChild(card);
        }

        // Fitur Like
        document.getElementById("galleryContainer").addEventListener("click", async (e) => {
            const btn = e.target.closest(".like-btn");
            if (btn) {
                const docId = btn.getAttribute("data-id");
                const docRef = doc(db, "images", docId);
                // Tambah like +1 di database
                await updateDoc(docRef, { likes: increment(1) });
                
                // Animasi kecil saat dilike
                btn.querySelector("i").classList.add("text-pink-500", "scale-125");
                setTimeout(() => btn.querySelector("i").classList.remove("scale-125"), 200);
            }
        });

        // Fitur Kompresi Gambar agar database tidak jebol
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement("canvas");
                    const MAX_WIDTH = 800; // Resolusi maksimal
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height && width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    } else if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height;
                        height = MAX_HEIGHT;
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Convert ke format JPEG dengan kualitas 70%
                    const dataUrl = canvas.toDataURL("image/jpeg", 0.7);
                    callback(dataUrl);
                };
            };
        }

        // Proses Upload
        document.getElementById("uploadForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            const file = document.getElementById("fileInput").files[0];
            const desc = document.getElementById("descInput").value;
            let uploader = document.getElementById("uploaderInput").value;
            
            if (!uploader) uploader = "Anonim";

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Mengunggah...`;

            // Kompresi sebelum upload
            compressImage(file, async (compressedBase64) => {
                try {
                    await addDoc(imagesCollection, {
                        url: compressedBase64,
                        desc: desc,
                        uploader: uploader,
                        likes: 0,
                        timestamp: new Date()
                    });
                    
                    document.getElementById("uploadForm").reset();
                    document.getElementById("uploadModal").classList.add("hidden");
                } catch (error) {
                    console.error("Error Upload:", error);
                    alert("Gagal mengunggah! Pastikan Firestore Database dalam 'Test Mode'.");
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = `Upload ke Galeri`;
                }
            });
        });

        // Fitur Pencarian
        document.getElementById("searchInput").addEventListener("input", (e) => {
            const keyword = e.target.value.toLowerCase();
            const gallery = document.getElementById("galleryContainer");
            gallery.innerHTML = "";
            
            const filtered = allImages.filter(img => 
                img.desc.toLowerCase().includes(keyword) || 
                img.uploader.toLowerCase().includes(keyword)
            );
            
            if (filtered.length === 0) {
                gallery.innerHTML = `<div class="text-slate-500 text-center col-span-full py-10">Tidak ditemukan gambar untuk "${keyword}"</div>`;
            } else {
                filtered.forEach(data => renderCard(data.id, data));
            }
        });
    </script>
</body>
</html>
